# Lint and import-order settings; run by ./lint.sh. Kept out of pyproject.toml,
# which stays the plain list of runtime dependencies.

line-length = 100
target-version = "py311"

[lint]
# pycodestyle errors and warnings, pyflakes, bugbear, and import sorting.
select = ["E", "W", "F", "B", "I"]

[lint.isort]
known-first-party = ["start_menu"]
